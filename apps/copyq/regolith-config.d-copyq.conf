# CopyQ Integration for Regolith Sway
# Place this file in: ~/.config/regolith3/sway/config.d/

# Autostart CopyQ daemon in background
exec --no-startup-id copyq

# Note: Use Mod4 (Super/Win) directly in partial config files

## Clipboard // Toggle CopyQ History // <> v ##
bindsym Mod4+v exec copyq toggle

## Clipboard // Paste Clipboard // <><Shift> v ##
bindsym Mod4+Shift+v exec copyq paste

## Clipboard // Open CopyQ Menu // <><Ctrl> v ##
bindsym Mod4+Ctrl+v exec copyq menu

# CopyQ window configuration (floating, centered, sticky)
for_window [app_id="com.github.hluk.copyq"] floating enable, sticky enable, resize set 650 550, move position center
for_window [app_id="copyq"] floating enable, sticky enable, resize set 650 550, move position center
for_window [class="(?i)copyq"] floating enable, sticky enable, resize set 650 550, move position center
